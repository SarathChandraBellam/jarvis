name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release when a v* tag is pushed
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Unit, end-to-end UI and screenshot tests
        run: ./gradlew testDebugUnitTest

      # Optional release signing: add repository secrets
      #   JARVIS_KEYSTORE_B64 (base64 of the .jks), JARVIS_STORE_PASSWORD, JARVIS_KEY_ALIAS, JARVIS_KEY_PASSWORD.
      # Without them the workflow still builds a debug-signed APK you can install.
      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.JARVIS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            {
              echo "storeFile=$RUNNER_TEMP/jarvis.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$RUNNER_TEMP/keystore.properties"
            echo "SIGN_ARGS=-PjarvisKeystoreProps=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease $SIGN_ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-test-report
          path: |
            app/build/screenshots/
            app/build/reports/tests/

      # Releases. A push to main whose versionName (app/build.gradle.kts) has no
      # release yet publishes one: bump the version, update CHANGELOG.md, merge to
      # main. Pushing a vX.Y.Z tag still works too. The release gets the APK (signed
      # when the signing secrets are set, otherwise debug-signed) and that version's
      # CHANGELOG section. Tests and the build above must pass first.
      - name: Decide release
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "$VERSION" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
              echo "v$VERSION is already released; nothing to publish."
            else
              TAG="v$VERSION"
            fi
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release tag: ${TAG:-none}"

      - name: Prepare release
        if: env.RELEASE_TAG != ''
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "jarvis-${TAG}.apk"
          CERT=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "jarvis-${TAG}.apk" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1)
          # v1.1.0's signing certificate: same key means the APK updates it in place.
          PREVIOUS=e2c0c44f4f2fadde2ca930c5c6f634014ac2c75de2b45b80b55802364c90e501
          {
            echo "**Install:** download \`jarvis-${TAG}.apk\` below and open it on your Android phone (8.0+)."
            echo
            if [ "$CERT" = "$PREVIOUS" ]; then
              echo "Updates v1.1.0 in place; your data is kept."
            else
              echo "**Signed with a different key from v1.1.0:** uninstall the existing app first, then install this APK. Uninstalling removes the app's local data."
            fi
            echo
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
            echo
            echo "Signing certificate SHA-256: \`${CERT}\`"
          } > release-notes.md
          cat release-notes.md

      # Creates the tag at this commit when it doesn't exist yet. Tags made with the
      # workflow's own token don't start another run, so a release is published once.
      - name: Publish release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: J.A.R.V.I.S. HUD ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: jarvis-${{ env.RELEASE_TAG }}.apk
